<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FW Images Directory Listing</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .logo {
            max-height: 50px;
            margin-bottom: 20px;
        }
        body.dark-mode {
            background-color: #1a1a2e;
            color: #e0e0e0;
        }
        body.dark-mode .table {
            color: #e0e0e0;
        }
        body.dark-mode .table-hover tbody tr:hover {
            background-color: #2a2a4e;
            color: #e0e0e0;
        }
        body.dark-mode .form-control {
            background-color: #2a2a4e;
            color: #e0e0e0;
            border-color: #444;
        }
        body.dark-mode .breadcrumb {
            background-color: #2a2a4e;
        }
        body.dark-mode a {
            color: #66aaff;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/img/LinksysLogo.png" alt="Linksys SmartWifi" class="logo">

        <h1 class="my-4">FW Images Directory Listing</h1>
        <div class="custom-control custom-switch my-3">
            <input type="checkbox" class="custom-control-input" id="darkModeSwitch">
            <label class="custom-control-label" for="darkModeSwitch">Dark Mode</label>
        </div>
        <nav id="breadcrumb" class="breadcrumb">
        </nav>
        <input class="form-control mb-3" id="search" type="text" placeholder="Search...">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Last Modified</th>
                    <th>Size</th>
                </tr>
            </thead>
            <tbody id="object-list">
            </tbody>
        </table>
        <div id="loading" class="text-center">
            <div class="spinner-border" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <div id="error" class="alert alert-danger d-none" role="alert">
        </div>

        <div class="mt-4 d-flex justify-content-between">
            <button id="prevPage" class="btn btn-primary" disabled>Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextPage" class="btn btn-primary">Next</button>
        </div>
        <div class="row mt-5">
            <div class="col">
                <p class="text-muted text-center">
                    FW Jenkins Build <a href="https://jenkins-fw.lswf.net/" target="_blank">https://jenkins-fw.lswf.net/</a>
                </p>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        // Dark mode toggle
        const darkSwitch = document.getElementById('darkModeSwitch');
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            darkSwitch.checked = true;
        }
        darkSwitch.addEventListener('change', () => {
            document.body.classList.toggle('dark-mode', darkSwitch.checked);
            localStorage.setItem('darkMode', darkSwitch.checked);
        });

        // State
        let allFiles = [];
        let filteredFiles = [];
        const PAGE_SIZE = 50;
        let currentPage = 1;
        let currentPrefix = '';

        async function fetchFiles() {
            try {
                const response = await fetch('files.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                allFiles = await response.json();
                document.getElementById('loading').classList.add('d-none');
                renderBreadcrumb();
                applyFilter();
            } catch (err) {
                document.getElementById('loading').classList.add('d-none');
                const errorEl = document.getElementById('error');
                errorEl.textContent = `Failed to load files: ${err.message}`;
                errorEl.classList.remove('d-none');
            }
        }

        function renderBreadcrumb() {
            const nav = document.getElementById('breadcrumb');
            nav.innerHTML = '';
            const parts = currentPrefix ? currentPrefix.replace(/\/$/, '').split('/') : [];
            const rootItem = document.createElement('a');
            rootItem.classList.add('breadcrumb-item');
            rootItem.href = '#';
            rootItem.textContent = 'Root';
            rootItem.addEventListener('click', e => { e.preventDefault(); navigateTo(''); });
            nav.appendChild(rootItem);
            let built = '';
            parts.forEach((part, i) => {
                built += part + '/';
                const prefix = built;
                const item = document.createElement('a');
                item.classList.add('breadcrumb-item');
                item.href = '#';
                item.textContent = part;
                if (i === parts.length - 1) item.classList.add('active');
                item.addEventListener('click', e => { e.preventDefault(); navigateTo(prefix); });
                nav.appendChild(item);
            });
        }

        function navigateTo(prefix) {
            currentPrefix = prefix;
            currentPage = 1;
            renderBreadcrumb();
            applyFilter();
        }

        function applyFilter() {
            const query = document.getElementById('search').value.toLowerCase();
            // Show only items directly under currentPrefix
            filteredFiles = allFiles.filter(f => {
                const key = f.key || f.Key || '';
                if (!key.startsWith(currentPrefix)) return false;
                const relative = key.slice(currentPrefix.length);
                // Only direct children (no further slashes except trailing)
                const withoutTrailing = relative.replace(/\/$/, '');
                if (!withoutTrailing) return false;
                if (withoutTrailing.includes('/')) return false;
                return !query || key.toLowerCase().includes(query);
            });
            currentPage = 1;
            renderPage();
        }

        function formatSize(bytes) {
            if (bytes == null || bytes === '') return '-';
            const n = parseInt(bytes, 10);
            if (isNaN(n)) return bytes;
            if (n === 0) return '-';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            let v = n;
            while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
            return `${v.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
        }

        function renderPage() {
            const tbody = document.getElementById('object-list');
            tbody.innerHTML = '';
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageItems = filteredFiles.slice(start, start + PAGE_SIZE);
            const totalPages = Math.max(1, Math.ceil(filteredFiles.length / PAGE_SIZE));

            pageItems.forEach(file => {
                const key = file.key || file.Key || '';
                const size = file.size !== undefined ? file.size : file.Size;
                const modified = file.last_modified || file.LastModified || '';
                const name = key.slice(currentPrefix.length).replace(/\/$/, '');
                const isDir = (file.key || file.Key || '').endsWith('/');

                const row = document.createElement('tr');
                const nameCell = document.createElement('td');
                if (isDir) {
                    const link = document.createElement('a');
                    link.href = '#';
                    link.innerHTML = `<i class="fa fa-folder mr-1"></i>${name}/`;
                    link.addEventListener('click', e => { e.preventDefault(); navigateTo(key); });
                    nameCell.appendChild(link);
                } else {
                    const link = document.createElement('a');
                    link.href = key;
                    link.innerHTML = `<i class="fa fa-file mr-1"></i>${name}`;
                    nameCell.appendChild(link);
                }
                row.appendChild(nameCell);

                const modCell = document.createElement('td');
                modCell.textContent = modified ? new Date(modified).toLocaleString() : '-';
                row.appendChild(modCell);

                const sizeCell = document.createElement('td');
                sizeCell.textContent = isDir ? '-' : formatSize(size);
                row.appendChild(sizeCell);

                tbody.appendChild(row);
            });

            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        document.getElementById('search').addEventListener('input', applyFilter);
        document.getElementById('prevPage').addEventListener('click', () => { currentPage--; renderPage(); });
        document.getElementById('nextPage').addEventListener('click', () => { currentPage++; renderPage(); });

        fetchFiles();
    </script>
</body>
</html>
